services:
  mysql:
    image: mysql:8.4
    container_name: s-care-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scare
      MYSQL_USER: scare
      MYSQL_PASSWORD: scare
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: